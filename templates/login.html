<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white">

<div class="bg-gray-800 p-8 rounded-2xl shadow-lg w-80">
    <h1 class="text-2xl mb-6 text-center">Login</h1>

    {% if error %}
    <div class="bg-red-500 p-2 rounded mb-4 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <input name="username"
               placeholder="Username"
               class="w-full mb-4 p-2 rounded bg-gray-700">

        <input name="password"
               type="password"
               placeholder="Password"
               class="w-full mb-6 p-2 rounded bg-gray-700">

        <button class="w-full bg-blue-600 hover:bg-blue-500 p-2 rounded">
            Login
        </button>
    </form>
</div>

</body>
</html>
